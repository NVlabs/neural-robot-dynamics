env:
  env_name: AnymalJointPositionControl
  env_mode: ground-truth
  model_path: ../../pretrained_models/NeRD_models/Anymal/model/nn/model.pt
  num_envs: 1

  max_episode_length: 800
  reward_bias: 0.

  warp_env_cfg:
    obs_type: dflex
    task: forward
    random_reset: false
    camera_tracking: true
    heading_yaws: [0.0]
    waypoint_mode: polar_zigzag
    # A 30-degree zigzag is reached through gentler 10-degree heading changes.
    zigzag_angle_degree: 30.0
    zigzag_turn_degree: 10.0
    step_length: 1.0
    step_length_max: 2.0
    # Avoid switching targets while the robot is still far from a corner.
    waypoint_tolerance: 0.35
    # Let the gait settle, then blend from the reset heading into WP0's bearing.
    startup_heading_hold_seconds: 0.5
    startup_heading_ramp_seconds: 0.5
    terminate_on_last_waypoint: true

rl:
  config:
    name: AnymalPPO
    max_epochs: 1000
    horizon_length: 32
    normalize_input: True
    normalize_value: True
    reward_shaper:
      scale_value: 1.
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 0.0003
    lr_schedule: adaptive
    kl_threshold: 0.008
    score_to_win: 3000000
    save_best_after: 10
    save_frequency: 50
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    minibatch_size: 16384
    mini_epochs: 5
    critic_coef: 4
    clip_value: True
    seq_length: 8
    bounds_loss_coef: 0.0001

    player:
      determenistic: True
      games_num: 1
      num_actors: 1
      print_stats: True

  network:
    mlp:
      units: [128, 64, 32]
      activation: relu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  other_params:
    fixed_sigma: True
